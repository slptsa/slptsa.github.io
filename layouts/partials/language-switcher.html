{{ $translations := .AllTranslations }}
{{ if gt (len $translations) 1 }}
<li class="nav-item has-dropdown lang-switcher">
  <button type="button" class="dropdown-toggle" aria-haspopup="true" aria-expanded="false" aria-label="{{ i18n "select_language" | default "Select language" }}">
    <span aria-hidden="true">🌐</span> <span class="lang-current-name">{{ .Language.LanguageName }}</span>
    <span class="dropdown-arrow" aria-hidden="true">▼</span>
  </button>
  <ul class="dropdown-menu lang-menu">
    {{ range $translations }}
    <li{{ if eq .Language.Lang $.Language.Lang }} class="lang-active"{{ end }}>
      <a href="{{ .RelPermalink }}" hreflang="{{ .Language.Lang }}" lang="{{ .Language.Lang }}">
        {{ if eq .Language.Lang $.Language.Lang }}✓ {{ end }}{{ .Language.LanguageName }}
      </a>
    </li>
    {{ end }}
  </ul>
</li>
{{ end }}
