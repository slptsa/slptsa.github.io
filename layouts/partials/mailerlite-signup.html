{{/* MailerLite "Newsletter" signup form (form 48341005), restyled to match the site.
     Include at most once per page: the form relies on a fixed element ID. */}}
<div id="mlb2-48341005" class="ml-form-embedContainer ml-subscribe-form ml-subscribe-form-48341005 signup-card">
  <div class="ml-form-embedWrapper embedForm">

    <div class="ml-form-embedBody row-form">
      <div class="signup-content">
        <h3>{{ i18n "signup_heading" }}</h3>
        <p>{{ i18n "signup_text" }}</p>
      </div>

      <form class="ml-block-form" action="https://assets.mailerlite.com/jsonp/2783271/forms/203724719586805000/subscribe" data-code="" method="post" target="_blank">
        <div class="signup-fields">
          <div class="ml-form-fieldRow">
            <div class="ml-field-group ml-field-name">
              <label for="ml-name" class="sr-only">{{ i18n "signup_name" }}</label>
              <input id="ml-name" type="text" class="form-control" name="fields[name]" placeholder="{{ i18n "signup_name" }}" autocomplete="given-name">
            </div>
          </div>
          <div class="ml-form-fieldRow ml-last-item">
            <div class="ml-field-group ml-field-email ml-validate-email ml-validate-required">
              <label for="ml-email" class="sr-only">{{ i18n "signup_email" }}</label>
              <input id="ml-email" type="email" class="form-control" name="fields[email]" placeholder="{{ i18n "signup_email" }}" autocomplete="email" aria-required="true">
            </div>
          </div>
        </div>

        <input type="hidden" name="ml-submit" value="1">

        <div class="ml-form-embedSubmit">
          <button type="submit" class="primary">{{ i18n "signup_button" }}</button>
          <button disabled="disabled" style="display: none;" type="button" class="loading">
            <span class="ml-form-embedSubmitLoad"></span>
            <span class="sr-only">{{ i18n "signup_loading" }}</span>
          </button>
        </div>

        <input type="hidden" name="anticsrf" value="true">
      </form>
    </div>

    <div class="ml-form-successBody row-success" style="display: none">
      <h3>{{ i18n "signup_thanks_heading" }}</h3>
      <p>{{ i18n "signup_thanks_text" }}</p>
    </div>

  </div>
</div>

<script>
  function ml_webform_success_48341005() {
    var $ = ml_jQuery || jQuery;
    $('.ml-subscribe-form-48341005 .row-success').show();
    $('.ml-subscribe-form-48341005 .row-form').hide();
  }
</script>
<script src="https://groot.mailerlite.com/js/w/webforms.min.js?v83147fa8ce2d95cb73ece7f28b469519" type="text/javascript"></script>
<script>
  fetch("https://assets.mailerlite.com/jsonp/2783271/forms/203724719586805000/takel")
</script>

.signup-card h3 { color: #0D5C75; margin: 0 0 0.5rem; }
.signup-card p { color: #444; line-height: 1.6; margin: 0 0 1.25rem; }

.signup-card input.form-control:focus { outline: none; border-color: #2B9B9E; box-shadow: 0 0 0 3px rgba(43,155,158,0.2); }

.signup-card .ml-form-embedSubmitLoad:after { content: " "; display: block; width: 11px; height: 11px; margin: 1px; border-radius: 50%; border: 4px solid #fff; border-color: #fff #fff #fff transparent; animation: ml-form-embedSubmitLoad 1.2s linear infinite; }
@keyframes ml-form-embedSubmitLoad { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

</style>
